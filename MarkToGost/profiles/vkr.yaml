наследует: гост
имена: [вкр, диплом, дипломная работа, выпускная квалификационная работа]
название: Выпускная квалификационная работа
описание: ВКР бакалавра или магистра, дипломный проект

титульный_лист:
  шаблон: vkr.docx
  обязательные_поля: [вуз, кафедра, направление, тема, студент, группа, руководитель, заведующий, город]

поля:
  задание_на: выпускную квалификационную работу
  министерство: Министерство науки и высшего образования Российской Федерации
  вид_работы: ВЫПУСКНАЯ КВАЛИФИКАЦИОННАЯ РАБОТА
  должность_руководителя: ""
  факультет: ""
  профиль: ""
  консультант: ""
  нормоконтроль: ""

# Дополнительные листы: включаются в шапке строкой «листы: [задание]»
листы:
  задание:
    шаблон: zadanie.docx
    после: титульный лист
    номер_страницы: false
    обязательные_поля: [тема, студент, руководитель, заведующий]

структура:
  - элемент: РЕФЕРАТ
    синонимы: [АННОТАЦИЯ]
    перед_содержанием: true
  - ВВЕДЕНИЕ
  - основная_часть
  - ЗАКЛЮЧЕНИЕ
  - элемент: СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ
    синонимы: [БИБЛИОГРАФИЧЕСКИЙ СПИСОК, СПИСОК ЛИТЕРАТУРЫ, ЛИТЕРАТУРА]
  - элемент: ПРИЛОЖЕНИЕ
    по_началу: true
    обязательный: false
