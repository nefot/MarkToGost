# Базовый профиль: текстовый документ по ГОСТ 7.32-2017.
# Остальные профили учебных работ наследуют его и задают только отличия.
имена: [гост, отчёт, отчет]
название: Отчёт по ГОСТ 7.32
описание: Текстовый документ без титульного листа — отчёт, пояснительная записка, методичка

оформление:
  шрифт: Times New Roman
  размер_шрифта: 14
  интервал: 1.5
  отступ_абзаца: 1.25
  красная_строка: true
  поле_слева: 3.0
  поле_справа: 1.0
  поле_сверху: 2.0
  поле_снизу: 2.0
  ширина_рисунков: 1.0
  размер_подписей: 12
  курсив_подписей: false
  размер_шрифта_таблиц: 12
  размер_шрифта_кода: 10
  интервал_кода: 1.0
  нумерация_страниц: true
  содержание: true
  заголовок_содержания: СОДЕРЖАНИЕ
  # «# Заголовок» начинает структурный элемент или раздел с новой страницы
  разделы_с_новой_страницы: true

поля:
  год: текущий год

структура: []
