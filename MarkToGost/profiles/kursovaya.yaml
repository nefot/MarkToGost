наследует: гост
имена: [курсовая, курсовая работа, курсовой проект]
название: Курсовая работа
описание: Пояснительная записка к курсовой работе или проекту

оформление:
  # Рисунок 2.1 в разделе 2, рисунок 3.2.1 в подразделе 3.2, рисунок А.1 в приложении А
  нумерация_объектов: по подразделам

титульный_лист:
  шаблон: kursovaya.docx
  обязательные_поля: [вуз, кафедра, дисциплина, тема, студент, группа, руководитель, город]

поля:
  задание_на: курсовую работу
  министерство: Министерство науки и высшего образования Российской Федерации
  вид_работы: КУРСОВАЯ РАБОТА
  должность_руководителя: ""
  факультет: ""

# Дополнительные листы: включаются в шапке строкой «листы: [задание]»
листы:
  задание:
    шаблон: zadanie.docx
    после: титульный лист
    номер_страницы: false
    обязательные_поля: [дисциплина, тема, студент, руководитель]

структура:
  - ВВЕДЕНИЕ
  - основная_часть
  - ЗАКЛЮЧЕНИЕ
  - элемент: СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ
    синонимы: [БИБЛИОГРАФИЧЕСКИЙ СПИСОК, СПИСОК ЛИТЕРАТУРЫ, ЛИТЕРАТУРА]
  - элемент: ПРИЛОЖЕНИЕ
    по_началу: true
    обязательный: false
