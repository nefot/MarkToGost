[pytest]
# Исключаем test_blocks.py из тестов (это утилита, не тесты)
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Не запускаем test_blocks.py как тесты
norecursedirs = .git .venv examples output __pycache__
testpaths = MarkToGost/tests

# Не воспринимаем указанные файлы как тесты
collect_ignore =
    test_blocks.py
    MarkToGost/utils/test_blocks.py

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

